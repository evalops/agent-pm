version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agent_pm
      POSTGRES_PASSWORD: agent_pm_dev
      POSTGRES_DB: agent_pm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_pm"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DATABASE_URL=postgresql+asyncpg://agent_pm:agent_pm_dev@postgres:5432/agent_pm
      - DRY_RUN=true
      - LOG_FORMAT=json
      - ENABLE_OPENTELEMETRY=false
    depends_on:
      postgres:
        condition: service_healthy
    command: uv run uvicorn app:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
